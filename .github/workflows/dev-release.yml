name: Dev release

on:
  push:
    branches:
      - ui-v1.3.0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalelauncher-dev-release
  cancel-in-progress: true

jobs:
  dev-release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: /tmp/scalelauncher-release.p12
      SCALELAUNCHER_KEYSTORE_PASSWORD: ${{ secrets.SCALELAUNCHER_KEYSTORE_PASSWORD }}
      SCALELAUNCHER_KEY_ALIAS: ${{ secrets.SCALELAUNCHER_KEY_ALIAS }}
      SCALELAUNCHER_KEY_PASSWORD: ${{ secrets.SCALELAUNCHER_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SCALELAUNCHER_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "SCALELAUNCHER_KEYSTORE_BASE64 fehlt"; exit 1; }
          test -n "$SCALELAUNCHER_KEYSTORE_PASSWORD" || { echo "SCALELAUNCHER_KEYSTORE_PASSWORD fehlt"; exit 1; }
          test -n "$SCALELAUNCHER_KEY_ALIAS" || { echo "SCALELAUNCHER_KEY_ALIAS fehlt"; exit 1; }
          test -n "$SCALELAUNCHER_KEY_PASSWORD" || { echo "SCALELAUNCHER_KEY_PASSWORD fehlt"; exit 1; }

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SCALELAUNCHER_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed dev APK
        env:
          SCALELAUNCHER_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          SCALELAUNCHER_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare dev release
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          TAG="dev-${GITHUB_RUN_NUMBER}"
          APK_NAME="ScaleLauncher-dev-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
          APK_FILE: ${{ steps.prepare.outputs.apk }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "$APK_FILE" "$APK_FILE.sha256" \
            --target "$GITHUB_SHA" \
            --title "ScaleLauncher Dev ${GITHUB_RUN_NUMBER}" \
            --notes "Automatischer Test-Build aus dem Branch ui-v1.3.0." \
            --prerelease \
            --latest=false

      - name: Remove restored keystore
        if: always()
        shell: bash
        run: rm -f "$KEYSTORE_PATH"
